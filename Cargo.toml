[workspace]
resolver = "2"
package.version = "0.11.0-beta.1"
members = [
    "crates/agentium-core",
    "crates/agentium_cli",
    "crates/bin_testing",
    "crates/notedeck",
    "crates/notedeck_chrome",
    "crates/notedeck_columns",
    "crates/notedeck_dave",
    "crates/notedeck_messages",
    "crates/notebook",
    "crates/notedeck_notebook",
    "crates/headway",
    "crates/headway_cli",
    "crates/notebook_cli",
    "crates/notedeck_headway",
    "crates/notedeck_nostrverse",
    "crates/notedeck_ui",
    "crates/notedeck_clndash",
    "crates/notedeck_dashboard",
    "crates/notedeck_horizon",
    "crates/nostr_calsync",
    "crates/md-stream",
    "crates/tokenator",
    "crates/wordid",
    "crates/enostr",
    "crates/enostr_test_support",
    "crates/protoverse",
    "crates/notedeck_wasm",
    "crates/notedeck_release",
    "crates/notedeck_testing",
]

[workspace.dependencies]
agentium-core = { path = "crates/agentium-core" }
opener = "0.8.2"
chrono = "0.4.40" 
crossbeam-channel = "0.5"
crossbeam = "0.8.4"
base32 = "0.4.0"
base64 = "0.22.1"
rmpv = "1.3.0"
rand = "0.9.2"
bech32 = { version = "0.11", default-features = false }
bip39 = { version = "2.2", default-features = false }
bitflags = "2.5.0"
dirs = "5.0.1"
# `system_fonts`: fall back to the OS's fonts for characters the bundled ones
# lack (e.g. ⧉), and turn on epaint's colour glyphs (COLR/sbix/CBDT).
eframe = { version = "0.36.2", default-features = false, features = [ "wgpu", "wayland", "x11", "android-game-activity", "system_fonts" ] }
egui = { version = "0.36.2", features = ["serde"] }
egui-wgpu = "0.36.2"
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
epaint = { version = "0.36.2", features = ["color_fonts"] }
egui-winit = { version = "0.36.2", features = ["android-game-activity", "clipboard"] }
egui_nav = { git = "https://github.com/damus-io/egui-nav", rev = "989b95c087f35eca134392e959c78f9be02b3422" }
egui_tabs = { git = "https://github.com/damus-io/egui-tabs", rev = "f352ebae7acadab328bf92d9ac7188caa520d676" }
egui_virtual_list = "0.12.0"
ehttp = "0.5.0"
hyper = { version = "1.7.0", features = ["full"] }
hyper-util = {version = "0.1" , features = ["tokio"]}
# hyper-rustls with NO default crypto provider (aws-lc-rs is default and requires cmake on Windows)
# Crates add platform-specific features: ring on Windows, aws-lc-rs elsewhere
hyper-rustls = { version = "0.27.7", default-features = false, features = ["http1", "tls12", "logging", "native-tokio", "webpki-roots"] }
http-body-util = "0.1.3"
# rustls with NO default crypto provider at workspace level.
# Crates use platform-specific dependencies to select:
# - Windows: ring (no cmake/NASM needed)
# - Other platforms: aws-lc-rs (better performance)
rustls = { version = "0.23.28", default-features = false, features = ["std", "tls12", "logging"] }
ring = "0.17"
enostr = { path = "crates/enostr" } 
fluent = "0.17.0"
fluent-resmgr = "0.0.8"
fluent-langneg = "0.13"
glam = { version = "0.30", features = ["bytemuck"] }
hex = { version = "0.4.3", features = ["serde"] }
negentropy = { version = "0.5", default-features = false, features = ["std"] }
image = { version = "0.25", features = ["jpeg", "png", "webp"] }
indexmap = "2.6.0"
libc = "0.2"
log = "0.4.17"
md5 = "0.7.0"
nostr = { version = "0.37.0", default-features = false, features = ["std", "nip44", "nip49"] }
nwc = "0.39.0"
mio = { version = "1.0.3", features = ["os-poll", "net"] }
nostrdb = { git = "https://github.com/damus-io/nostrdb-rs", rev = "c2f770a85c1d" }
#nostrdb = "0.6.1"
nostrdb_net = { git = "https://github.com/damus-io/nostrdb-rs", rev = "c2f770a85c1d" }
notedeck = { path = "crates/notedeck" }
notedeck_chrome = { path = "crates/notedeck_chrome" }
notedeck_clndash = { path = "crates/notedeck_clndash" }
notedeck_dashboard = { path = "crates/notedeck_dashboard" }
notedeck_horizon = { path = "crates/notedeck_horizon" }
nostr_calsync = { path = "crates/nostr_calsync" }
notedeck_columns = { path = "crates/notedeck_columns" }
notedeck_dave = { path = "crates/notedeck_dave" }
notedeck_messages = { path = "crates/notedeck_messages" }
notebook = { path = "crates/notebook" }
notedeck_notebook = { path = "crates/notedeck_notebook" }
headway = { path = "crates/headway" }
notedeck_headway = { path = "crates/notedeck_headway" }
notedeck_nostrverse = { path = "crates/notedeck_nostrverse" }
renderbud = { path = "crates/renderbud", features = ["egui"] }
notedeck_ui = { path = "crates/notedeck_ui" }
notedeck_testing = { path = "crates/notedeck_testing" }
notedeck_wasm = { path = "crates/notedeck_wasm" }
tokenator = { path = "crates/tokenator" }
md-stream = { path = "crates/md-stream" }
wordid = { path = "crates/wordid" }
bin_testing = { path = "crates/bin_testing" }
once_cell = "1.19.0"
bytemuck = "1.22.0"
robius-open = "0.1"
poll-promise = { version = "0.3.0", features = ["tokio"] }
puffin = { git = "https://github.com/EmbarkStudios/puffin", package = "puffin", rev = "4bdd85760c895623b08f236c23cf54bbaaafd91b" }
puffin_egui = { git = "https://github.com/EmbarkStudios/puffin", package = "puffin_egui", rev = "4bdd85760c895623b08f236c23cf54bbaaafd91b" }
serde = { version = "1", features = ["derive"] } # You only need this if you want app persistence
serde_derive = "1"
serde_json = "1.0.89"
strum = "0.26"
strum_macros = "0.26"
thiserror = "2.0.7"
tokio = { version = "1.16", features = ["macros", "rt-multi-thread", "fs"] }
tokio-tungstenite = "0.24"
tracing = { version = "0.1.40", features = ["log"] }
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3.13.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
url = "2.5.2"
urlencoding = "2.1.3"
uuid = { version = "1.10.0", features = ["v4"] }
sha2 = "0.10.8"
hkdf = "0.12.4"
bincode = "1.3.3"
mime_guess = "2.0.5"
pretty_assertions = "1.4.1"
jni = "0.21.1"
profiling = "1.0.18"
lightning-invoice = { version = "0.33.1", features = ["serde"] }
secp256k1 = "0.30.0"
hashbrown = "0.15.2"
slab = "0.4.9"
socket2 = { version = "0.6", features = ["all"] }
if-watch = { version = "3.2", features = ["tokio"] }
ipnet = "2.12"
openai-api-rs = "6.0.3"
re_memory = "0.38"
oot_bitset = "0.1.1"
blurhash = "0.2.3"
android-activity = { git = "https://github.com/damus-io/android-activity", rev = "642d4b05836f6cc12c3bd775bcf0d1b467e2014d", features = [ "game-activity" ] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "vendored"] }
android-keyring = "0.2.0"
rfd = "0.15"
egui_kittest = "0.36.2"
pollster = "0.4"
futures-util = "0.3"
arboard = { git = "https://github.com/jb55/arboard", rev = "05755435fc8cf910449a8388bb8926a92b2db51e" }
flate2 = "1"
self-replace = "1"
semver = "1"
tar = "0.4"
wgpu = { version = "30", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
rodio = { version = "0.20", default-features = false, features = ["wav", "mp3"] }

[profile.small]
inherits = 'release'
opt-level = 'z'     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = 'abort'     # Abort on panic
strip = true        # Strip symbols from binary*


