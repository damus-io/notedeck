name: Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      additional-setup:
        required: false
        type: string

jobs:
  run:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Additional Setup (if specified)
        if: ${{ inputs.additional-setup != '' }}
        run: ${{ inputs.additional-setup }}

      - name: Run Tests (Native Only)
        run: cargo test --workspace --exclude notedeck_columns --exclude notedeck_dave --exclude notedeck_messages --exclude notedeck_notebook
        env:
          CI: true

      # The chrome routes an open by reference, or a click on another app's
      # inline widget, to the app that owns it — but those apps sit behind
      # cargo features the workspace run above doesn't turn on, so without
      # this step that routing is never tested.
      - name: Run notedeck_chrome Cross-App Tests
        run: cargo test -p notedeck_chrome --features dave,notebook,headway
        env:
          CI: true

      - name: Run notedeck_notebook Tests
        run: cargo test -p notedeck_notebook -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_dave Tests
        run: cargo test -p notedeck_dave -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_columns Unit Tests
        run: cargo test -p notedeck_columns --lib
        env:
          CI: true

      - name: Run notedeck_columns E2E Tests
        run: cargo test -p notedeck_columns --test columns_e2e -- --test-threads=1
        env:
          CI: true

      # The per-frame allocation ratchet. Its own step rather than part of the
      # E2E run above, because it is the one test in the suite whose failure
      # means "somebody made a frame more expensive" rather than "something is
      # broken", and that is worth reading off the job list without opening it.
      #
      # `--nocapture` so the measured distribution is in the log on a pass too;
      # a ratchet whose number only appears when it breaks is a number nobody
      # has looked at. On macOS and Windows the test measures and reports
      # without asserting, since the budget is an x86-64 Linux figure — see
      # `off_the_reference_build` in that file.
      - name: Run notedeck_columns Frame Allocation Budget
        run: cargo test -p notedeck_columns --test frame_alloc -- --test-threads=1 --nocapture
        env:
          CI: true

      - name: Run notedeck_messages Unit Tests
        run: cargo test -p notedeck_messages --lib
        env:
          CI: true

      - name: Run notedeck_messages E2E Tests
        run: cargo test -p notedeck_messages --test messages_e2e -- --test-threads=1
        env:
          CI: true
