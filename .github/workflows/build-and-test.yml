name: Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      additional-setup:
        required: false
        type: string

jobs:
  run:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Additional Setup (if specified)
        if: ${{ inputs.additional-setup != '' }}
        run: ${{ inputs.additional-setup }}

      # TEMPORARY diagnostics for headway:notedeck/purse-happy-else — the Windows
      # STATUS_ACCESS_VIOLATION in notedeck's lib tests. Remove once attributed.
      #
      # The first round ruled out two whole explanations: the same binary passes
      # run serially (`--test-threads=1`), and passes run parallel with the test
      # set narrowed to `app::` — the module the crash's cut points at. So it is
      # an interaction that needs both parallelism and a wider test set, and no
      # single test is broken.
      #
      # These three split the remaining space in one job. `continue-on-error`
      # throughout: they only add information, and the real steps below still
      # decide the job.
      #
      # 1. Standalone. The crash has only ever been seen inside
      #    `cargo test --workspace`, which runs a dozen other crates' binaries
      #    first. If this passes and the workspace step still crashes, the
      #    interaction is with what those leave behind, not with notedeck's own
      #    tests — a completely different search.
      - name: Windows crash, notedeck lib standalone (temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo test -p notedeck --lib
        env:
          CI: true
          RUST_BACKTRACE: 1

      # 2. Everything except the headless-tick tests. Both crashes cut off in
      #    their neighbourhood, so if this passes they are necessary — and since
      #    `app::` alone was clean, necessary but not sufficient.
      - name: Windows crash, notedeck lib without tick_headless (temporary)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: cargo test -p notedeck --lib -- --skip tick_headless
        env:
          CI: true
          RUST_BACKTRACE: 1

      # 3. Everything except `app::`, the mirror of the run that was already
      #    clean. Passing here too would put the fault squarely on `app::`
      #    running alongside the rest.
      - name: "Windows crash, notedeck lib without app:: (temporary)"
        if: runner.os == 'Windows'
        continue-on-error: true
        run: 'cargo test -p notedeck --lib -- --skip app::'
        env:
          CI: true
          RUST_BACKTRACE: 1

      - name: Run Tests (Native Only)
        run: cargo test --workspace --exclude notedeck_columns --exclude notedeck_dave --exclude notedeck_messages --exclude notedeck_notebook
        env:
          CI: true

      - name: Run notedeck_notebook Tests
        run: cargo test -p notedeck_notebook -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_dave Tests
        run: cargo test -p notedeck_dave -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_columns Unit Tests
        run: cargo test -p notedeck_columns --lib
        env:
          CI: true

      - name: Run notedeck_columns E2E Tests
        run: cargo test -p notedeck_columns --test columns_e2e -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_messages Unit Tests
        run: cargo test -p notedeck_messages --lib
        env:
          CI: true

      - name: Run notedeck_messages E2E Tests
        run: cargo test -p notedeck_messages --test messages_e2e -- --test-threads=1
        env:
          CI: true
