name: Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      additional-setup:
        required: false
        type: string

jobs:
  run:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Additional Setup (if specified)
        if: ${{ inputs.additional-setup != '' }}
        run: ${{ inputs.additional-setup }}

      - name: Run Tests (Native Only)
        run: cargo test --workspace --exclude notedeck_columns --exclude notedeck_dave --exclude notedeck_messages --exclude notedeck_notebook
        env:
          CI: true

      # TEMPORARY diagnostics for headway:notedeck/purse-happy-else — the Windows
      # STATUS_ACCESS_VIOLATION in notedeck's lib tests. Remove once attributed.
      #
      # Round one (c05475c5e59d) answered the big question: the fault is NOT the
      # workspace, the runner or the disk. Standalone, with the feature set
      # `cargo test --workspace` unifies onto notedeck, it crashes on its own:
      #
      #   cargo test -p notedeck --lib --features sound,snapshot-testing,auto-update
      #       -> STATUS_ACCESS_VIOLATION, exit -1073741819
      #   cargo test -p notedeck --lib --features auto-update
      #       -> exit 0
      #
      # Both run the same 342 tests — auto-update is the only one of the three
      # that adds any (the 21 `updater::*`) — so the trigger is `sound` and/or
      # `snapshot-testing` being *linked*, not any test's logic, and not anything
      # left behind by another crate's binary.
      #
      # `sound` is the favourite: it makes `SoundManager::new` real, and
      # `Notedeck::init` calls it unconditionally, so every test that builds a
      # `Notedeck` (app::tick_headless_tests, app::render_nav_tests,
      # app::prune_swap_tests — exactly the region all six crashes land in) opens
      # a real audio device via `rodio::OutputStream::try_default()` on a headless
      # runner with no audio device. That also fits `--test-threads=1` being
      # clean. `snapshot-testing` only adds `software_renderer()`, which
      # notedeck's own tests never call, so it would have to fault purely from
      # linking egui-wgpu.
      #
      # This round splits them so the fix lands on the right one.
      - name: Windows crash, standalone with the workspace feature set (temporary)
        if: always() && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test -p notedeck --lib --features sound
          "RESULT sound only: exit $LASTEXITCODE"
          cargo test -p notedeck --lib --features snapshot-testing
          "RESULT snapshot-testing only: exit $LASTEXITCODE"
        env:
          CI: true

      - name: Run notedeck_notebook Tests
        run: cargo test -p notedeck_notebook -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_dave Tests
        run: cargo test -p notedeck_dave -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_columns Unit Tests
        run: cargo test -p notedeck_columns --lib
        env:
          CI: true

      - name: Run notedeck_columns E2E Tests
        run: cargo test -p notedeck_columns --test columns_e2e -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_messages Unit Tests
        run: cargo test -p notedeck_messages --lib
        env:
          CI: true

      - name: Run notedeck_messages E2E Tests
        run: cargo test -p notedeck_messages --test messages_e2e -- --test-threads=1
        env:
          CI: true
