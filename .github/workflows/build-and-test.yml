name: Test

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      additional-setup:
        required: false
        type: string

jobs:
  run:
    runs-on: ${{ inputs.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Additional Setup (if specified)
        if: ${{ inputs.additional-setup != '' }}
        run: ${{ inputs.additional-setup }}

      # Every app feature is on, so the chrome is built and tested with the
      # apps it ships with and its cross-app routing (an open by reference, a
      # click on another app's inline widget) is covered. The profiling and
      # tooling features (tracy, puffin, memory, auto-update, snapshot-testing)
      # stay off: they change how the binary is instrumented, not what it does.
      - name: Run Tests (Native Only)
        run: cargo test --workspace --exclude notedeck_columns --exclude notedeck_dave --exclude notedeck_messages --exclude notedeck_notebook --features dave,messages,notebook,headway,nostrverse,clndash,dashboard,horizon,wasm
        env:
          CI: true

      # Headway through the real chrome with nav slides on, as the app ships,
      # and the chrome's global history under a real egui_nav drag.
      # Release only: during a slide egui_nav draws two routes of one app on
      # two layers with the same widget ids, which egui debug-asserts against
      # (compiled out in release). See
      # crates/notedeck_chrome/src/chrome/headway_nav_tests.rs.
      - name: Run Nav Slide Tests (Release, Real Chrome)
        run: cargo test --release -p notedeck_chrome --features headway --lib -- headway_nav_tests global_nav_tests::slide_tests
        env:
          CI: true

      - name: Run notedeck_notebook Tests
        run: cargo test -p notedeck_notebook -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_dave Tests
        run: cargo test -p notedeck_dave -- --test-threads=1
        env:
          CI: true

      - name: Run notedeck_columns Unit Tests
        run: cargo test -p notedeck_columns --lib
        env:
          CI: true

      - name: Run notedeck_columns E2E Tests
        run: cargo test -p notedeck_columns --test columns_e2e -- --test-threads=1
        env:
          CI: true

      # The per-frame allocation ratchet. Its own step rather than part of the
      # E2E run above, because it is the one test in the suite whose failure
      # means "somebody made a frame more expensive" rather than "something is
      # broken", and that is worth reading off the job list without opening it.
      #
      # `--nocapture` so the measured distribution is in the log on a pass too;
      # a ratchet whose number only appears when it breaks is a number nobody
      # has looked at. On macOS and Windows the test measures and reports
      # without asserting, since the budget is an x86-64 Linux figure — see
      # `off_the_reference_build` in that file.
      - name: Run notedeck_columns Frame Allocation Budget
        run: cargo test -p notedeck_columns --test frame_alloc -- --test-threads=1 --nocapture
        env:
          CI: true

      - name: Run notedeck_messages Unit Tests
        run: cargo test -p notedeck_messages --lib
        env:
          CI: true

      - name: Run notedeck_messages E2E Tests
        run: cargo test -p notedeck_messages --test messages_e2e -- --test-threads=1
        env:
          CI: true
