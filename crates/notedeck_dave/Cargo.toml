[package]
name = "notedeck_dave"
edition = "2021"
version.workspace = true

[dependencies]
agentium-core = { workspace = true }
# A spec session's coding tools in a microVM guest (`src/sandbox.rs`). Light
# without its `microvm` feature (no microsandbox), which only `sandbox`
# below turns on; it tells every build whether it can run guests.
agentium-sandbox = { workspace = true }
headway = { workspace = true }
notedeck_ipc = { workspace = true }
async-openai = { version = "0.28.0", default-features = false, features = ["rustls-webpki-roots"] }
claude-agent-sdk-rs = { git = "https://github.com/jb55/claude-agent-sdk-rs", rev = "a0e4b81f157e" }
bitflags = { workspace = true }
egui = { workspace = true }
egui_nav = { workspace = true }
egui-winit = { workspace = true }
profiling = { workspace = true }
sha2 = { workspace = true }
notedeck = { workspace = true }
notedeck_ui = { workspace = true }
eframe = { workspace = true }
tokio = { workspace = true }
nostrdb_net = { workspace = true }
tracing = { workspace = true }
egui-wgpu = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
nostrdb = { workspace = true }
# The agentium data tools' grep: its smart-case pattern, and the compiled
# regex its answer carries to highlight matches.
cli_term = { workspace = true }
regex = "1"
crossbeam-channel = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
poll-promise = { workspace = true }
rand = { workspace = true }
uuid = { version = "1", features = ["v4"] }
bytemuck = {workspace = true }
futures = "0.3.31"
dashmap = "6"
#reqwest = "0.12.15"
# The web toolset's fetch: a URI to check on every redirect hop, and the
# search instance's request URL.
hyper = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
egui_extras = { workspace = true }
md-stream = { workspace = true }
similar = "2"
dirs = "5"
gethostname = "1"
arboard = { workspace = true }
image = { workspace = true }
base64 = { workspace = true }
mime_guess = { workspace = true }
tempfile = { workspace = true }
opener = { workspace = true }
# The throwaway store `test_support` opens, for the `test-support` feature.
ndb_testing = { workspace = true, optional = true }

[features]
# `test_support`'s seeded Dave, public, for another crate's tests (chrome's
# end-to-end key tests host one).
test-support = ["dep:ndb_testing"]
# DESKTOP ONLY: run sandboxed specs' coding tools in microsandbox guests.
# Compiles microsandbox's graph, so it is off by default and in every
# mobile build; on a platform microsandbox can't run on it does nothing
# (build.rs sets `cfg(sandbox)` only on KVM Linux and Apple-Silicon macOS).
# crates/bin_testing/tests/sandbox_desktop_only.rs checks the fences.
sandbox = ["agentium-sandbox/microvm"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
rfd = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[dev-dependencies]
ndb_testing = { workspace = true }
# egui no longer bundles fonts by default; harnesses that don't install
# notedeck's own fonts fall back to egui's, as they did before 0.36.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
# FakeVms, the in-memory VmHost a sandboxed session's guest routing is
# tested over (src/sandbox.rs).
agentium-sandbox = { workspace = true, features = ["test-support"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
eframe = { workspace = true, features = ["accesskit"] }
notedeck = { workspace = true, features = ["snapshot-testing"] }
# Chrome owns Dave's normal-mode keymap; the key tests resolve keys through
# its engine and shipped `default_keymap.toml`, as the app does.
notedeck_chrome = { workspace = true }
notedeck_testing = { workspace = true }
nostr = { workspace = true }
nostr-relay-builder = "0.37"
serial_test = "3"
