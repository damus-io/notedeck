[package]
name = "notedeck_ui"
edition = "2021"
version.workspace = true

[dependencies]
eframe = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
egui-winit = { workspace = true }
strum_macros = { workspace = true }
strum = { workspace = true }
ehttp = { workspace = true }
nostrdb = { workspace = true }
tracing = { workspace = true }
poll-promise = { workspace = true }
profiling = { workspace = true }
tokio = { workspace = true }
notedeck = { workspace = true }
image = { workspace = true }
bitflags = { workspace = true }
nostrdb_net = { workspace = true }
hashbrown = { workspace = true }
md-stream = { workspace = true }

[dev-dependencies]
# egui no longer bundles fonts by default; harnesses that don't install
# notedeck's own fonts fall back to egui's, as they did before 0.36.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
blurhash = { workspace = true }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
eframe = { workspace = true, features = ["accesskit"] }
pollster = { workspace = true }
wgpu = { workspace = true }
notedeck = { workspace = true, features = ["snapshot-testing"] }
notedeck_testing = { workspace = true }
