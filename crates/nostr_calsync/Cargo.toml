[package]
name = "nostr_calsync"
edition = "2024"
version.workspace = true

[dependencies]
nostrdb = { workspace = true }
enostr = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }

# Apple EventKit lives only on macOS; every other target uses NullSource and
# never pulls this in.
[target.'cfg(target_os = "macos")'.dependencies]
eventkit-rs = "0.5"

[dev-dependencies]
tempfile = { workspace = true }
