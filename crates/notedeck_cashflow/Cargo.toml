[package]
name = "notedeck_cashflow"
edition = "2024"
version.workspace = true

[dependencies]
egui = { workspace = true }
glam = { workspace = true }
notedeck = { workspace = true }
poll-promise = { workspace = true }
profiling = { workspace = true }
renderbud = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# egui no longer bundles fonts by default; harnesses that don't install
# notedeck's own fonts fall back to egui's, as they did before 0.36.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
notedeck = { workspace = true, features = ["snapshot-testing"] }
# The HUD gallery shows the HUD tooltip on a `notedeck_ui::charts` chart.
notedeck_ui = { workspace = true }
tempfile = { workspace = true }
