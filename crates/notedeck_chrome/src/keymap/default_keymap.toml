# Notedeck's built-in keymap. Each [[bind]] maps a key sequence in a key scope
# to a UI tool (or a [macro.<name>]); see crates/notedeck_chrome/src/keymap/parse.rs
# for the format and keys.rs for the key syntax.
#
# The "global" scope is searched after the active app's own scopes, so an app
# binding of the same keys wins. Headway's and Dave's bindings live here; the
# apps read no bare keys of their own.
#
# `label` and `group` are the which-key strip's: adjacent bindings of one
# group with the same label share one hint (`j k  up/down`).

[[bind]]
scope = "global"
keys  = "?"
tool  = "chrome_toggle_key_hints"
label = "keys"
group = "help"

[[bind]]
scope = "global"
keys  = "<Esc>"
tool  = "chrome_hide_key_hints"
label = "hide keys"
group = "help"

# Vim's jump list, per app: a binding marked `jump = true` (`g g`, `G`, `] q`)
# records where the app's view was before it fires, and Ctrl-O / Ctrl-I walk
# back and forward through those (crates/notedeck_chrome/src/chrome/jumps.rs).
# Each is offered only while there is somewhere to go, so the keys fall
# through otherwise.

[[bind]]
scope = "global"
keys  = "<C-o>"
tool  = "chrome_jump_back"
label = "jump back/forward"
group = "jump"

[[bind]]
scope = "global"
keys  = "<C-i>"
tool  = "chrome_jump_forward"
label = "jump back/forward"
group = "jump"

# With no jump to walk, Ctrl-O / Ctrl-I fall through to the app's history:
# the chrome's back and forward (Alt-←/→), as vim's Ctrl-O goes on across
# files. Back also returns to the app a cross-app open came from.

[[bind]]
scope = "global"
keys  = "<C-o>"
tool  = "chrome_nav_back"
label = "back/forward"
group = "jump"

[[bind]]
scope = "global"
keys  = "<C-i>"
tool  = "chrome_nav_forward"
label = "back/forward"
group = "jump"

# Cmd-Shift-H / Cmd-Shift-L: back and forward straight away, whatever the
# jump list holds (a shifted `h` / `l`). Plain Cmd-H is macOS's Hide.

[[bind]]
scope = "global"
keys  = "<D-H>"
tool  = "chrome_nav_back"
label = "back/forward"
group = "jump"

[[bind]]
scope = "global"
keys  = "<D-L>"
tool  = "chrome_nav_forward"
label = "back/forward"
group = "jump"

# ── Headway ─────────────────────────────────────────────────────────────────
#
# Headway reports a stack of these scopes per view (crates/notedeck_headway/
# src/ui_tools.rs, `key_scopes`):
#
#   grid    headway.grid, headway.card
#   queue   headway.card, headway.scroll, headway.diff, headway.queue
#   pane    headway.card, headway.scroll, headway.diff, headway.pane
#   detail  headway.card, headway.scroll, headway.detail
#   list    headway.list, headway.card
#
# No two scopes of one stack bind the same keys, so their order only sets the
# which-key strip's: a view's own navigation and the card actions in the order
# the strip has always listed them. Which binding runs where is the tools'
# availability: `headway_open_card` is not offered in the detail (its card is
# open), `headway_clear` only with a cursor to drop, so Esc falls through.
#
# The board edits `a` (archive), `D` (done) and `H L J K` (move the cursor
# card) are Headway's data tools on "{current}", the current card. The view
# follows each edit as it folds in: the grid's cursor steps off an archived
# card, the review queue steps on past one that left In Review.

# The card actions: the current card, the same in every view.

[[bind]]
scope = "headway.card"
keys  = "<Enter>"
tool  = "headway_open_card"
label = "open"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "o"
tool  = "headway_open_card"
label = "open"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "e"
tool  = "headway_open_explainer"
label = "explainer"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "s"
tool  = "headway_open_session"
label = "session/review"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "S"
tool  = "headway_open_session"
args  = { code_review = true }
label = "session/review"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "r"
tool  = "headway_open_review"
label = "review diff"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "a"
tool  = "headway_archive_card"
args  = { card = "{current}" }
label = "archive"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "D"
tool  = "headway_move_card"
args  = { card = "{current}", column = "done" }
label = "done"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "X"
tool  = "headway_send_back"
label = "send back"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "C"
tool  = "headway_quick_comment"
label = "comment"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "n"
tool  = "headway_step_card"
args  = { dir = "next" }
jump  = true
label = "next/prev card"
group = "card"

[[bind]]
scope = "headway.card"
keys  = "p"
tool  = "headway_step_card"
args  = { dir = "prev" }
jump  = true
label = "next/prev card"
group = "card"

# Offered only on a subissue; shares its `g` with `g g` in the grid's and
# the panes' scopes.
[[bind]]
scope = "headway.card"
keys  = "g p"
tool  = "headway_open_parent"
label = "parent"
group = "card"

