tool  = "headway_scroll"
args  = { to = "top" }
jump  = true
label = "top/bottom"
group = "scroll"

[[bind]]
scope = "headway.scroll"
keys  = "G"
tool  = "headway_scroll"
args  = { to = "bottom" }
jump  = true
label = "top/bottom"
group = "scroll"

# A review pane's diff, in the queue or opened from a card: its files, its
# card's commits (`}` the next sha chip, older; `{` the previous, newer), and
# commenting on the lines picked in it (or, with none picked, the commit).
# The card's `C` sends what's drafted here; with nothing drafted it asks for a
# one-line comment instead.

[[bind]]
scope = "headway.diff"
keys  = "]"
tool  = "headway_step_file"
args  = { dir = "next" }
label = "next/prev file"
group = "diff"

[[bind]]
scope = "headway.diff"
keys  = "["
tool  = "headway_step_file"
args  = { dir = "prev" }
label = "next/prev file"
group = "diff"

[[bind]]
scope = "headway.diff"
keys  = "}"
tool  = "headway_step_commit"
args  = { dir = "next" }
label = "next/prev commit"
group = "diff"

[[bind]]
scope = "headway.diff"
keys  = "{"
tool  = "headway_step_commit"
args  = { dir = "prev" }
label = "next/prev commit"
group = "diff"

[[bind]]
scope = "headway.diff"
keys  = "c"
tool  = "headway_comment"
label = "comment (picked lines or commit)"
group = "comment"

[[bind]]
scope = "headway.diff"
keys  = "m"
tool  = "headway_raw_message"
label = "raw message"
group = "diff"

# Leaving the review queue, for the grid (or an epic's detail).

[[bind]]
scope = "headway.queue"
keys  = "q"
tool  = "headway_back"
label = "leave"
group = "exit"

[[bind]]
scope = "headway.queue"
keys  = "<Esc>"
tool  = "headway_back"
label = "leave"
group = "exit"

# Leaving a review pane opened from a card, for the card's detail.

[[bind]]
scope = "headway.pane"
keys  = "q"
tool  = "headway_back"
label = "back to card"
group = "exit"

[[bind]]
scope = "headway.pane"
keys  = "<Esc>"
tool  = "headway_back"
label = "back to card"
group = "exit"

# The card detail: a review queue over its In Review subissues, and back to
# the grid.

[[bind]]
scope = "headway.detail"
keys  = "R"
tool  = "headway_open_review_queue"
label = "review queue here"
group = "detail"

[[bind]]
scope = "headway.detail"
keys  = "q"
tool  = "headway_back"
label = "back"
group = "detail"

[[bind]]
scope = "headway.detail"
keys  = "<Esc>"
tool  = "headway_back"
label = "back"
group = "detail"

# The issue list, every board's cards in one list. Its current card is the
# cursor row's, on whichever board that is (headway:notedeck/exile-finger-birth),
# so the card actions above act there: `a` and `D` edit the row's board, `e`
# and `s` read it, and `r`, `X` and `C` open the row's detail, switching boards,
# and run over it. `Enter`/`o` are the card actions' too, and fold a group
# header the cursor rests on. `n`/`p` and `g p` aren't offered: `j`/`k` step,
# and every parent is a row already.

[[bind]]
scope = "headway.list"
keys  = "j"
tool  = "headway_cursor_move"
args  = { to = "down" }
label = "up/down"
group = "list"

[[bind]]
scope = "headway.list"
keys  = "k"
tool  = "headway_cursor_move"
args  = { to = "up" }
label = "up/down"
group = "list"

[[bind]]
scope = "headway.list"
keys  = "g g"
tool  = "headway_cursor_move"
args  = { to = "first" }
jump  = true
label = "first/last"
group = "list"

[[bind]]
scope = "headway.list"
keys  = "G"
tool  = "headway_cursor_move"
args  = { to = "last" }
jump  = true
label = "first/last"
group = "list"

[[bind]]
scope = "headway.list"
keys  = "/"
tool  = "headway_focus_filter"
label = "filter"
group = "list"

# `J`/`K` move the cursor's card a place later or earlier in its board's work
# order, as dragging its row does (headway:notedeck/until-object-oak): past
# the next or previous card in its group, an epic's subissues and all.
# Offered only while the list runs in work order, top first, and the card has
# such a neighbour on the board showing, so otherwise they fall through.

[[bind]]
scope = "headway.list"
keys  = "J"
tool  = "headway_list_move_down"
label = "reorder"
group = "list"

[[bind]]
scope = "headway.list"
keys  = "K"
tool  = "headway_list_move_up"
label = "reorder"
group = "list"

# The list's group headers (headway:notedeck/ice-basket-taxi): the cursor
# rests on them as on a row, so `j`/`k` walk them too, and Enter or `o` on one
# folds it as a click does. Offered only while the list is grouped.

[[bind]]
scope = "headway.list"
keys  = "] g"
tool  = "headway_list_step_group"
args  = { dir = "next" }
label = "next/prev group"
group = "fold"

[[bind]]
scope = "headway.list"
keys  = "[ g"
tool  = "headway_list_step_group"
args  = { dir = "prev" }
label = "next/prev group"
group = "fold"

[[bind]]
scope = "headway.list"
keys  = "z a"
tool  = "headway_list_fold"
args  = { to = "toggle" }
label = "fold group"
group = "fold"

[[bind]]
scope = "headway.list"
keys  = "z c"
tool  = "headway_list_fold"
args  = { to = "close" }
label = "close/open group"
group = "fold"

[[bind]]
scope = "headway.list"
keys  = "z o"
tool  = "headway_list_fold"
args  = { to = "open" }
label = "close/open group"
group = "fold"

[[bind]]
scope = "headway.list"
keys  = "z M"
tool  = "headway_list_fold"
args  = { to = "all" }
label = "fold/unfold all"
group = "fold"

[[bind]]
scope = "headway.list"
keys  = "z R"
tool  = "headway_list_fold"
args  = { to = "none" }
label = "fold/unfold all"
group = "fold"

# `c` composes a card in the cursor's group, as its header's `+` does.

[[bind]]
scope = "headway.list"
keys  = "c"
tool  = "headway_compose_card"
label = "new in group"
group = "fold"

# The list's view tabs and Display menu (headway:notedeck/mercy-unique-foil):
# `gt`/`gT` step through the tabs as vim's do, `go` cycles the ordering and
# `gs` names what the list shows as a new view. The grouping, sub-grouping,
# ordering direction and row properties are UI tools without a key
# (`headway_list_group`, `headway_list_subgroup`, `headway_list_order_dir`,
# `headway_list_display`), for the action bar.

[[bind]]
scope = "headway.list"
keys  = "g t"
tool  = "headway_list_tab"
args  = { to = "next" }
label = "next/prev tab"
group = "view"

[[bind]]
scope = "headway.list"
keys  = "g T"
tool  = "headway_list_tab"
args  = { to = "prev" }
label = "next/prev tab"
group = "view"

[[bind]]
scope = "headway.list"
keys  = "g o"
tool  = "headway_list_order"
args  = { by = "next" }
label = "next ordering"
group = "view"

[[bind]]
scope = "headway.list"
keys  = "g s"
tool  = "headway_list_save_view"
label = "save view"
group = "view"

[[bind]]
scope = "headway.list"
keys  = "q"
tool  = "headway_back"
label = "back to board"
group = "exit"

[[bind]]
scope = "headway.list"
keys  = "<Esc>"
tool  = "headway_back"
label = "back to board"
group = "exit"

# ── Dave ────────────────────────────────────────────────────────────────────
#
# Dave's normal mode: Esc in the chat input enters it, and while it is on Dave
# reports these scopes (crates/notedeck_dave/src/ui_tools.rs, `key_scopes`):
#
#   chat      dave.chat, dave.normal, dave
#   sessions  dave.sessions, dave.normal, dave
#   scene     dave.scene, dave.sessions, dave.normal, dave
#
# `h` / `l` switch between the two panes: `j k g g G` walk the chat's blocks
# in one and the session list in the other. In the scene view the map is the
# session pane: `h` steps onto it, and there `h j k l` step between its nodes,
# `l` off its right edge back onto the chat. Insert mode reports none, so
# every key types. Esc at normal mode's root isn't bound here: it falls
# through to the side menu, and normal mode stays on. The permission keys
# (`1 2 3 !`), a question's digits and Enter, and Delete are Dave's own, read
# while the input is unfocused.

# The chat pane: the block cursor and the folds.

[[bind]]
scope = "dave.chat"
keys  = "j"
tool  = "dave_block_cursor"
args  = { to = "down" }
label = "next/prev block"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "k"
tool  = "dave_block_cursor"
args  = { to = "up" }
label = "next/prev block"
group = "blocks"

# `J`/`K` stretch a range of messages a row down or up from the block
# cursor's row (or the range a Shift+click picked), and its pill says how long
# they took. Esc drops the range, ahead of normal mode's own Esc.

[[bind]]
scope = "dave.chat"
keys  = "J"
tool  = "dave_chat_range"
args  = { to = "down" }
label = "stretch range"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "K"
tool  = "dave_chat_range"
args  = { to = "up" }
label = "stretch range"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "g g"
tool  = "dave_block_cursor"
args  = { to = "first" }
jump  = true
label = "first/last"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "G"
tool  = "dave_block_cursor"
args  = { to = "last" }
jump  = true
label = "first/last"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "z a"
tool  = "dave_block"
args  = { op = "toggle" }
label = "toggle"
group = "fold"

[[bind]]
scope = "dave.chat"
keys  = "o"
tool  = "dave_block"
args  = { op = "toggle" }
label = "toggle"
group = "fold"

[[bind]]
scope = "dave.chat"
keys  = "z o"
tool  = "dave_block"
args  = { op = "open" }
label = "expand"
group = "fold"

[[bind]]
scope = "dave.chat"
keys  = "z c"
tool  = "dave_block"
args  = { op = "close" }
label = "collapse"
group = "fold"

# `zr` / `zm` with or without Shift: vim's `zR` / `zM`, but the shifted press
# doesn't arrive reliably.

[[bind]]
scope = "dave.chat"
keys  = "z r"
tool  = "dave_block"
args  = { op = "expand_all" }
label = "expand all"
group = "fold all"

[[bind]]
scope = "dave.chat"
keys  = "z R"
tool  = "dave_block"
args  = { op = "expand_all" }
label = "expand all"
group = "fold all"

[[bind]]
scope = "dave.chat"
keys  = "z m"
tool  = "dave_block"
args  = { op = "collapse_all" }
label = "collapse all"
group = "fold all"

[[bind]]
scope = "dave.chat"
keys  = "z M"
tool  = "dave_block"
args  = { op = "collapse_all" }
label = "collapse all"
group = "fold all"

[[bind]]
scope = "dave.chat"
keys  = "q"
tool  = "dave_block_cursor"
args  = { to = "clear" }
label = "leave blocks"
group = "exit"

# The session list pane: switch sessions without focusing their input. Enter
# picks the one you're on and hands its input the keyboard.

[[bind]]
scope = "dave.sessions"
keys  = "j"
tool  = "dave_session_cursor"
args  = { to = "next" }
label = "next/prev session"
group = "sessions"

[[bind]]
scope = "dave.sessions"
keys  = "k"
tool  = "dave_session_cursor"
args  = { to = "prev" }
label = "next/prev session"
group = "sessions"

[[bind]]
scope = "dave.sessions"
keys  = "g g"
tool  = "dave_session_cursor"
args  = { to = "first" }
jump  = true
label = "first/last"
group = "sessions"

[[bind]]
scope = "dave.sessions"
keys  = "G"
tool  = "dave_session_cursor"
args  = { to = "last" }
jump  = true
label = "first/last"
group = "sessions"

[[bind]]
scope = "dave.sessions"
keys  = "<Enter>"
tool  = "dave_insert_mode"
label = "pick"
group = "exit"

# The scene's map, in place of the session list: step to the nearest node
# that way. The list's `g g`, `G` and Enter still apply beneath these.

[[bind]]
scope = "dave.scene"
keys  = "h"
tool  = "dave_scene_cursor"
args  = { to = "left" }
label = "step on the map"
group = "scene"

[[bind]]
scope = "dave.scene"
keys  = "j"
tool  = "dave_scene_cursor"
args  = { to = "down" }
label = "step on the map"
group = "scene"

[[bind]]
scope = "dave.scene"
keys  = "k"
tool  = "dave_scene_cursor"
args  = { to = "up" }
label = "step on the map"
group = "scene"

[[bind]]
scope = "dave.scene"
keys  = "l"
tool  = "dave_scene_cursor"
args  = { to = "right" }
label = "step on the map"
group = "scene"

# Either pane: the panes, back to the input, and the session's own keys.

[[bind]]
scope = "dave.normal"
keys  = "h"
tool  = "dave_focus_pane"
args  = { pane = "sessions" }
label = "session list"
group = "pane"

[[bind]]
scope = "dave.normal"
keys  = "l"
tool  = "dave_focus_pane"
args  = { pane = "chat" }
label = "chat"
group = "pane"

[[bind]]
scope = "dave.normal"
keys  = "i"
tool  = "dave_insert_mode"
label = "insert"
group = "exit"

[[bind]]
scope = "dave.normal"
keys  = "a"
tool  = "dave_insert_mode"
label = "insert"
group = "exit"

[[bind]]
scope = "dave.normal"
keys  = "n"
tool  = "dave_new_agent"
label = "new"
group = "session"

[[bind]]
scope = "dave.normal"
keys  = "c"
tool  = "dave_clone_agent"
label = "clone"
group = "session"

[[bind]]
scope = "dave.normal"
keys  = "r"
tool  = "dave_rename_agent"
label = "rename"
group = "session"

[[bind]]
scope = "dave.normal"
keys  = "d d"
tool  = "dave_delete_session"
label = "delete"
group = "session"

[[bind]]
scope = "dave.normal"
keys  = "v"
tool  = "dave_toggle_view"
label = "scene view"
group = "view"

# Permission mode, by name: `m` then the mode's letter. No cycle, so no key
# lands on a mode you didn't ask for. Bypass is deliberately unbound.

[[bind]]
scope = "dave.normal"
keys  = "m m"
tool  = "dave_set_permission_mode"
args  = { mode = "manual" }
label = "manual"
group = "mode"

[[bind]]
scope = "dave.normal"
keys  = "m p"
tool  = "dave_set_permission_mode"
args  = { mode = "plan" }
label = "plan"
group = "mode"

[[bind]]
scope = "dave.normal"
keys  = "m e"
tool  = "dave_set_permission_mode"
args  = { mode = "accept_edits" }
label = "accept edits"
group = "mode"

[[bind]]
scope = "dave.normal"
keys  = "m a"
tool  = "dave_set_permission_mode"
args  = { mode = "auto" }
label = "auto"
group = "mode"

[[bind]]
scope = "dave.normal"
keys  = "e"
tool  = "dave_external_editor"
label = "editor"
group = "view"

[[bind]]
scope = "dave.normal"
keys  = "g d"
tool  = "dave_session_tab"
args  = { tab = "details" }
label = "details/chat tab"
group = "view"

[[bind]]
scope = "dave.normal"
keys  = "g c"
tool  = "dave_session_tab"
args  = { tab = "chat" }
label = "details/chat tab"
group = "view"

[[bind]]
scope = "dave.normal"
keys  = "s"
tool  = "dave_open_issue"
label = "open issue"
group = "turn"

# `s` then Headway's `e`, in one key: see [macro.session-explainer] below.
[[bind]]
scope = "dave.normal"
keys  = "E"
macro = "session-explainer"
label = "card explainer"
group = "turn"

[[bind]]
scope = "dave.normal"
keys  = "S"
tool  = "dave_interrupt"
label = "stop turn"
group = "turn"

[[bind]]
scope = "dave.normal"
keys  = "] q"
tool  = "dave_focus_queue"
args  = { dir = "next" }
jump  = true
label = "focus queue"
group = "queue"

[[bind]]
scope = "dave.normal"
keys  = "[ q"
tool  = "dave_focus_queue"
args  = { dir = "prev" }
jump  = true
label = "focus queue"
group = "queue"

# ── Macros ──────────────────────────────────────────────────────────────────
#
# A macro is a list of tool calls, run one after another, each once the one
# before has settled: whatever it opened has resolved and come to the front,
# drawn a frame, and offers the next tool (crates/notedeck_chrome/src/keymap/
# macros.rs). A step that doesn't settle within 3s aborts the run.

# Open the session's card in Headway, then its explainer. Dave never learns
# what an explainer is; a session with no card has no `dave_open_issue`, so
# its `E` falls through.
[macro.session-explainer]
label = "card explainer"
steps = [ { tool = "dave_open_issue" }, { tool = "headway_open_explainer" } ]
