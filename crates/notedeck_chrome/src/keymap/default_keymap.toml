[[bind]]
scope = "dave.normal"
keys  = "a"
tool  = "dave_insert_mode"
label = "insert"
group = "exit"

[[bind]]
scope = "dave.normal"
keys  = "n"
tool  = "dave_new_agent"
label = "new"
group = "session"

[[bind]]
scope = "dave.normal"
keys  = "c"
tool  = "dave_clone_agent"
label = "clone"
group = "session"

[[bind]]
scope = "dave.normal"
keys  = "r"
tool  = "dave_rename_agent"
label = "rename"
group = "session"

[[bind]]
scope = "dave.normal"
keys  = "d d"
tool  = "dave_delete_session"
label = "delete"
group = "session"

[[bind]]
scope = "dave.normal"
keys  = "v"
tool  = "dave_toggle_view"
label = "scene view"
group = "view"

[[bind]]
scope = "dave.normal"
keys  = "m"
tool  = "dave_cycle_permission_mode"
label = "permission mode"
group = "view"

[[bind]]
scope = "dave.normal"
keys  = "e"
tool  = "dave_external_editor"
label = "editor"
group = "view"

[[bind]]
scope = "dave.normal"
keys  = "g d"
tool  = "dave_session_tab"
args  = { tab = "details" }
label = "details/chat tab"
group = "view"

[[bind]]
scope = "dave.normal"
keys  = "g c"
tool  = "dave_session_tab"
args  = { tab = "chat" }
label = "details/chat tab"
group = "view"

[[bind]]
scope = "dave.normal"
keys  = "s"
tool  = "dave_open_issue"
label = "open issue"
group = "turn"

# `s` then Headway's `e`, in one key: see [macro.session-explainer] below.
[[bind]]
scope = "dave.normal"
keys  = "E"
macro = "session-explainer"
label = "card explainer"
group = "turn"

[[bind]]
scope = "dave.normal"
keys  = "S"
tool  = "dave_interrupt"
label = "stop turn"
group = "turn"

[[bind]]
scope = "dave.normal"
keys  = "] q"
tool  = "dave_focus_queue"
args  = { dir = "next" }
label = "focus queue"
group = "queue"

[[bind]]
scope = "dave.normal"
keys  = "[ q"
tool  = "dave_focus_queue"
args  = { dir = "prev" }
label = "focus queue"
group = "queue"

# ── Macros ──────────────────────────────────────────────────────────────────
#
# A macro is a list of tool calls, run one after another, each once the one
# before has settled: whatever it opened has resolved and come to the front,
# drawn a frame, and offers the next tool (crates/notedeck_chrome/src/keymap/
# macros.rs). A step that doesn't settle within 3s aborts the run.

# Open the session's card in Headway, then its explainer. Dave never learns
# what an explainer is; a session with no card has no `dave_open_issue`, so
# its `E` falls through.
[macro.session-explainer]
label = "card explainer"
steps = [ { tool = "dave_open_issue" }, { tool = "headway_open_explainer" } ]
