label = "first/last"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "G"
tool  = "headway_cursor_move"
args  = { to = "last" }
jump  = true
label = "first/last"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "H"
tool  = "headway_move_card"
args  = { card = "{current}", to = "left" }
label = "move card"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "L"
tool  = "headway_move_card"
args  = { card = "{current}", to = "right" }
