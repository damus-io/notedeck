keys  = "c"
tool  = "headway_comment"
label = "comment (picked lines or commit)"
group = "comment"

[[bind]]
scope = "headway.diff"
keys  = "C"
tool  = "headway_send_comments"
label = "send comments"
group = "comment"

# Leaving the review queue, for the grid (or an epic's detail).

[[bind]]
scope = "headway.queue"
keys  = "q"
tool  = "headway_back"
label = "leave"
group = "exit"

[[bind]]
scope = "headway.queue"
keys  = "<Esc>"
tool  = "headway_back"
label = "leave"
group = "exit"

# Leaving a review pane opened from a card, for the card's detail.

[[bind]]
scope = "headway.pane"
keys  = "q"
tool  = "headway_back"
label = "back to card"
group = "exit"

[[bind]]
scope = "headway.pane"
keys  = "<Esc>"
tool  = "headway_back"
label = "back to card"
group = "exit"

# The card detail: a review queue over its In Review subissues, and back to
