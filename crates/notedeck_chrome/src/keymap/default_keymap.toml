group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "J"
tool  = "headway_move_card"
args  = { card = "{current}", to = "down" }
label = "reorder"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "K"
tool  = "headway_move_card"
args  = { card = "{current}", to = "up" }
label = "reorder"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "c"
tool  = "headway_compose_card"
label = "new"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "R"
tool  = "headway_open_review_queue"
label = "review queue"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "/"
tool  = "headway_focus_filter"
label = "filter"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "g i"
tool  = "headway_open_list"
label = "issue list"
group = "grid"

# Boards: `] b` / `[ b` step through them in the switcher's order, `g b`
# opens the picker, whose filter field then has the keyboard.

[[bind]]
scope = "headway.grid"
keys  = "] b"
tool  = "headway_next_board"
label = "next/prev board"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "[ b"
tool  = "headway_prev_board"
label = "next/prev board"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "g b"
tool  = "headway_pick_board"
label = "boards"
group = "grid"

[[bind]]
scope = "headway.grid"
keys  = "<Esc>"
tool  = "headway_clear"
label = "clear"
group = "grid"

# Scrolling a review pane's diff or the card detail.

[[bind]]
scope = "headway.scroll"
keys  = "j"
tool  = "headway_scroll"
args  = { to = "down" }
label = "scroll"
group = "scroll"

[[bind]]
scope = "headway.scroll"
keys  = "k"
tool  = "headway_scroll"
args  = { to = "up" }
label = "scroll"
group = "scroll"

[[bind]]
scope = "headway.scroll"
keys  = "<Space>"
tool  = "headway_scroll"
args  = { to = "page_down" }
label = "page"
group = "scroll"

[[bind]]
scope = "headway.scroll"
keys  = "<C-f>"
tool  = "headway_scroll"
args  = { to = "page_down" }
label = "page"
group = "scroll"

[[bind]]
scope = "headway.scroll"
keys  = "<C-b>"
tool  = "headway_scroll"
args  = { to = "page_up" }
label = "page"
group = "scroll"

[[bind]]
scope = "headway.scroll"
keys  = "<S-Space>"
tool  = "headway_scroll"
args  = { to = "page_up" }
label = "page"
group = "scroll"

[[bind]]
