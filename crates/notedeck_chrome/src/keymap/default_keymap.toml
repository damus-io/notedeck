keys  = "<Esc>"
tool  = "headway_back"
label = "back"
group = "detail"

# ── Dave ────────────────────────────────────────────────────────────────────
#
# Dave's normal mode: Esc in the chat input enters it, and while it is on Dave
# reports these scopes (crates/notedeck_dave/src/ui_tools.rs, `key_scopes`):
#
#   chat      dave.chat, dave.normal, dave
#   sessions  dave.sessions, dave.normal, dave
#
# `h` / `l` switch between the two panes: `j k g g G` walk the chat's blocks
# in one and the session list in the other. Insert mode reports none, so
# every key types. Esc at normal mode's root isn't bound here: it falls
# through to the side menu, and normal mode stays on. The permission keys
# (`1 2 3 !`), a question's digits and Enter, and Delete are Dave's own, read
# while the input is unfocused.

# The chat pane: the block cursor and the folds.

[[bind]]
scope = "dave.chat"
keys  = "j"
tool  = "dave_block_cursor"
args  = { to = "down" }
label = "next/prev block"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "k"
tool  = "dave_block_cursor"
args  = { to = "up" }
label = "next/prev block"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "g g"
tool  = "dave_block_cursor"
args  = { to = "first" }
label = "first/last"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "G"
tool  = "dave_block_cursor"
args  = { to = "last" }
label = "first/last"
group = "blocks"

[[bind]]
scope = "dave.chat"
keys  = "z a"
tool  = "dave_block"
args  = { op = "toggle" }
label = "toggle"
group = "fold"

[[bind]]
scope = "dave.chat"
keys  = "o"
tool  = "dave_block"
args  = { op = "toggle" }
label = "toggle"
group = "fold"

[[bind]]
scope = "dave.chat"
keys  = "z o"
tool  = "dave_block"
args  = { op = "open" }
label = "expand"
group = "fold"

[[bind]]
scope = "dave.chat"
keys  = "z c"
tool  = "dave_block"
args  = { op = "close" }
label = "collapse"
group = "fold"

# `zr` / `zm` with or without Shift: vim's `zR` / `zM`, but the shifted press
# doesn't arrive reliably.

[[bind]]
scope = "dave.chat"
keys  = "z r"
tool  = "dave_block"
args  = { op = "expand_all" }
label = "expand all"
group = "fold all"

[[bind]]
scope = "dave.chat"
keys  = "z R"
tool  = "dave_block"
args  = { op = "expand_all" }
label = "expand all"
group = "fold all"

[[bind]]
scope = "dave.chat"
keys  = "z m"
tool  = "dave_block"
args  = { op = "collapse_all" }
label = "collapse all"
group = "fold all"

[[bind]]
scope = "dave.chat"
keys  = "z M"
tool  = "dave_block"
args  = { op = "collapse_all" }
label = "collapse all"
group = "fold all"

[[bind]]
scope = "dave.chat"
keys  = "q"
tool  = "dave_block_cursor"
args  = { to = "clear" }
label = "leave blocks"
group = "exit"

# The session list pane: switch sessions without focusing their input. Enter
# picks the one you're on and hands its input the keyboard.

[[bind]]
scope = "dave.sessions"
keys  = "j"
tool  = "dave_session_cursor"
args  = { to = "next" }
label = "next/prev session"
group = "sessions"

[[bind]]
scope = "dave.sessions"
keys  = "k"
tool  = "dave_session_cursor"
args  = { to = "prev" }
label = "next/prev session"
group = "sessions"

[[bind]]
scope = "dave.sessions"
keys  = "g g"
tool  = "dave_session_cursor"
args  = { to = "first" }
label = "first/last"
group = "sessions"

[[bind]]
scope = "dave.sessions"
keys  = "G"
tool  = "dave_session_cursor"
args  = { to = "last" }
label = "first/last"
group = "sessions"

[[bind]]
scope = "dave.sessions"
keys  = "<Enter>"
tool  = "dave_insert_mode"
label = "pick"
group = "exit"

# Either pane: the panes, back to the input, and the session's own keys.

[[bind]]
