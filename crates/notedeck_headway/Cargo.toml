[package]
name = "notedeck_headway"
edition = "2024"
version.workspace = true

[dependencies]
headway = { workspace = true }
notedeck = { workspace = true }
notedeck_ui = { workspace = true }
egui = { workspace = true }
nostrdb = { workspace = true }
nostrdb_net = { workspace = true }
enostr = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
md-stream = { workspace = true }
image = { workspace = true }
profiling = { workspace = true }
renderbud = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# egui no longer bundles fonts by default; harnesses that don't install
# notedeck's own fonts fall back to egui's, as they did before 0.36.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
notedeck = { workspace = true, features = ["snapshot-testing"] }
# Chrome owns Headway's keymap; the test harnesses resolve keys through its
# engine and shipped `default_keymap.toml`, as the app does. The `headway`
# feature is chrome's routing into Headway (an open by note or reference), so
# the nav tests can run the real Headway inside the real chrome. Cargo allows
# this dev-dependency cycle: the tests link the one `notedeck_headway` chrome
# does, so a `HeadwayRoute` token downcasts on both sides.
notedeck_chrome = { workspace = true, features = ["headway"] }
notedeck_testing = { workspace = true }
renderbud = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[features]
default = []
snapshot-testing = ["notedeck/snapshot-testing"]
