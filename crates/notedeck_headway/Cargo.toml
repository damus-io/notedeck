[package]
name = "notedeck_headway"
edition = "2024"
version.workspace = true

[dependencies]
headway = { workspace = true }
notedeck = { workspace = true }
notedeck_ui = { workspace = true }
egui = { workspace = true }
nostrdb = { workspace = true }
nostrdb_net = { workspace = true }
enostr = { workspace = true }
nostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
image = { workspace = true }
profiling = { workspace = true }
renderbud = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# egui no longer bundles fonts by default; harnesses that don't install
# notedeck's own fonts fall back to egui's, as they did before 0.36.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
egui_kittest = { workspace = true, features = ["snapshot", "wgpu"] }
notedeck = { workspace = true, features = ["snapshot-testing"] }
notedeck_testing = { workspace = true }
renderbud = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

[features]
default = []
snapshot-testing = ["notedeck/snapshot-testing"]
