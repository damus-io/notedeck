[package]
name = "enostr"
version = "0.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Native websocket transport (crate::relay::ws). We own the socket via
# tokio-tungstenite so relay liveness can be observed at the socket level;
# rustls-tls-webpki-roots provides wss:// TLS with bundled roots.
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { workspace = true }
socket2 = { workspace = true }
ipnet = { workspace = true }
serde_derive = { workspace = true }
serde = { workspace = true, features = ["derive"] } # You only need this if you want app persistence
serde_json = { workspace = true }
nostr = { workspace = true }
bech32 = { workspace = true }
nostrdb = { workspace = true }
# nostrdb-net convergence (phase 4): enostr re-exports nostrdb_net's primitives
# during the migration so there is ONE Pubkey/Keypair/… type workspace-wide.
# This transitional dependency is removed when enostr is finally deleted.
nostrdb_net = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
mio = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "net", "macros", "time"] }
hashbrown = { workspace = true }
slab = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
negentropy = { workspace = true }
uuid = { workspace = true }
profiling = { workspace = true }

# Interface watching (crate::relay::netwatch). Android is excluded: if-watch has
# no netlink backend there, so it falls back to polling getifaddrs(), which is
# both a battery drain and unavailable below Android API 24 — it fails to link
# against the NDK platform level we build with.
[target.'cfg(not(target_os = "android"))'.dependencies]
if-watch = { workspace = true }

# rustls 0.23 needs a process-level CryptoProvider selected for wss:// TLS. We
# depend on rustls directly (matching notedeck's platform choice) so exactly one
# provider is compiled into standalone consumers like the CLIs — without it the
# first wss:// handshake panics in get_default_or_install_from_crate_features.
# `install_crypto()` installs it explicitly; see crate::install_crypto.
# Use ring on Windows (fewer build requirements than aws-lc-rs, which needs cmake/NASM).
[target.'cfg(windows)'.dependencies]
rustls = { version = "0.23.28", default-features = false, features = ["std", "tls12", "logging", "ring"] }

# Use aws-lc-rs on non-Windows platforms for better performance.
[target.'cfg(not(windows))'.dependencies]
rustls = { version = "0.23.28", default-features = false, features = ["std", "tls12", "logging", "aws_lc_rs"] }

[dev-dependencies]
nostr-database = "0.37"
nostr-relay-builder = "0.37"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = { workspace = true }
