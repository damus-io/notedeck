[package]
name = "cashflow"
edition = "2024"
version.workspace = true
description = "cashflow's non-UI core: the $CASHFLOW_DIR layout, config, secrets, the nostr vault, importers, rules and the loaded books"

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
dirs = { workspace = true }
ehttp = { workspace = true, features = ["native-async"] }
flate2 = { workspace = true }
futures-util = { workspace = true }
gethostname = "1"
headway = { workspace = true }
hex = { workspace = true }
ledgerdb = { workspace = true }
lnsocket = { git = "https://github.com/jb55/lnsocket-rs", rev = "51b397521e54" }
nostrdb = { workspace = true }
nostrdb_net = { workspace = true }
profiling = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
toml = { workspace = true, features = ["display"] }
toml_edit = { workspace = true }
wordid = { workspace = true }

[dev-dependencies]
ndb_testing = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
