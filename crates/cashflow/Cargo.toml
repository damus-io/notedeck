[package]
name = "cashflow"
edition = "2024"
version.workspace = true
description = "cashflow's non-UI core: the $CASHFLOW_DIR layout, config, secrets, the nostr vault, importers, rules and the loaded books"

[dependencies]
base64 = { workspace = true }
chrono = { workspace = true }
chrono-tz = { workspace = true }
dirs = { workspace = true }
ehttp = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
ledgerdb = { workspace = true }
lnsocket = "0.5.1"
nostrdb = { workspace = true }
nostrdb_net = { workspace = true }
profiling = { workspace = true }
ring = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true, features = ["display"] }
wordid = { workspace = true }

[dev-dependencies]
ndb_testing = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
