[package]
name = "agentium-core"
edition = "2021"
version.workspace = true

[dependencies]
nostrdb = { workspace = true }
# nostrdb_net backs the standalone Engine's relay layer: RelayPool for the live
# subscription stream and relay::sync::pull_reconcile for NIP-77 negentropy
# backfill (which owns the negentropy set construction, so this crate no longer
# depends on the negentropy crate directly).
nostrdb_net = { workspace = true }
enostr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
# sha2 backs `spawn_idempotency_key`: a spawn command's default idempotency key
# is a digest of the request itself, so an identical retry carries an identical
# key and the host can recognize it as the same request.
sha2 = { workspace = true }
uuid = { version = "1.10.0", features = ["v4"] }
# Shared BIP-39 word-id rendering for sayable session references.
wordid = { workspace = true }
# md-stream is a zero-dependency, egui-free markdown parser (String -> elements);
# it backs AssistantMessage's incremental parse and stays platform-neutral.
md-stream = { workspace = true }
similar = "2"
# "process" and "io-util" run the coding toolset's Bash on the host
# (agent_spec::local_executor) with a timeout and cancellation.
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "process", "io-util"] }
thiserror = { workspace = true }
tracing = { workspace = true }
# Puffin scopes on the hot per-chip reads (e.g. latest_activity_created_at, run
# once per visible agentium chip per frame).
profiling = { workspace = true }
# Terminal text shared with the other CLIs (`paint`, grep's smart-case
# pattern and match highlight), for the `cli` module's renderers.
cli_term = { workspace = true }
regex = "1"
# ripgrep's directory walker: the coding toolset's Grep and Glob skip what
# .gitignore skips (target/, node_modules/) and take ripgrep's --glob syntax.
ignore = "0.4"
# Glob's pattern match, where `*` stops at a `/` and `**` crosses it.
globset = "0.4"
# StreamExt::next drives the session-watch subscription stream.
futures-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
# kill(2) on a Bash call's whole process group when it times out or is
# cancelled, so a command's own children don't outlive it.
libc = "0.2"

[dev-dependencies]
ndb_testing = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = { workspace = true }
