[package]
name = "bin_testing"
edition = "2021"
version.workspace = true
description = "Find this worktree's own build of a CLI binary for e2e tests when git worktrees share one target/ dir"

[dependencies]

[dev-dependencies]
tempfile = { workspace = true }
# tests/signatures.rs parses the workspace's sources; span-locations gives
# each offender its line.
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }
